# Compose autonome pour Dokploy.
# Pas de "include" ni réseau bridge custom : tous les services sur dokploy-network.
# Noms de services préfixés (entsoft-*) pour éviter les collisions DNS sur dokploy-network.
# Base SQLite persistée via volume entsoft_sqlite_data.

name: ent-soft

services:
  entsoft-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-${APP_SECRET}}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/www/html/var/database/data.db}
      SQLITE_DATABASE_PATH: ${SQLITE_DATABASE_PATH:-/var/www/html/var/database/data.db}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-'^https?://(.*)$'}
      FRANKFURTER_API_URL: ${FRANKFURTER_API_URL:-https://api.frankfurter.dev}
      FRANKFURTER_CACHE_TTL: ${FRANKFURTER_CACHE_TTL:-3600}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_LOAD_FIXTURES: ${RUN_LOAD_FIXTURES:-false}
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-REMOTE_ADDR}
      SYMFONY_TRUSTED_HEADERS: ${SYMFONY_TRUSTED_HEADERS:-x-forwarded-for,x-forwarded-host,x-forwarded-proto}
    volumes:
      - entsoft_api_uploads:/var/www/html/public/uploads
      - entsoft_sqlite_data:/var/www/html/var/database
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - dokploy-network

  entsoft-web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      entsoft-api:
        condition: service_healthy
    environment:
      API_UPSTREAM_HOST: ${API_UPSTREAM_HOST:-entsoft-api}
      API_UPSTREAM_PORT: ${API_UPSTREAM_PORT:-80}
    expose:
      - "80"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  entsoft_sqlite_data:
  entsoft_api_uploads:
