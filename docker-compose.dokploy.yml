# Compose autonome pour Dokploy (calqué sur StockifyWeb multi-shop).
# Pas de "include" ni réseau bridge custom : tous les services sur dokploy-network.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-super_cargo}
      MYSQL_USER: ${MYSQL_USER:-super_cargo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - dokploy-network

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-${APP_SECRET}}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-super_cargo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-super_cargo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DATABASE_URL: mysql://${MYSQL_USER:-super_cargo}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-super_cargo}?serverVersion=8.0&charset=utf8mb4
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-'^https?://(.*)$'}
      FRANKFURTER_API_URL: ${FRANKFURTER_API_URL:-https://api.frankfurter.dev}
      FRANKFURTER_CACHE_TTL: ${FRANKFURTER_CACHE_TTL:-3600}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_LOAD_FIXTURES: ${RUN_LOAD_FIXTURES:-false}
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-REMOTE_ADDR}
      SYMFONY_TRUSTED_HEADERS: ${SYMFONY_TRUSTED_HEADERS:-x-forwarded-for,x-forwarded-host,x-forwarded-proto}
    volumes:
      - api_uploads:/var/www/html/public/uploads
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM_HOST: ${API_UPSTREAM_HOST:-api}
      API_UPSTREAM_PORT: ${API_UPSTREAM_PORT:-80}
    expose:
      - "80"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  mysql_data:
  api_uploads:
