doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            SharedKernel:
                type: attribute
                dir: '%kernel.project_dir%/src/SharedKernel/Domain/ValueObject'
                prefix: 'App\SharedKernel\Domain\ValueObject'
            IdentityAccess:
                type: attribute
                dir: '%kernel.project_dir%/src/IdentityAccess/Domain/Entity'
                prefix: 'App\IdentityAccess\Domain\Entity'
            Client:
                type: attribute
                dir: '%kernel.project_dir%/src/Client/Domain/Entity'
                prefix: 'App\Client\Domain\Entity'
            Site:
                type: attribute
                dir: '%kernel.project_dir%/src/Site/Domain/Entity'
                prefix: 'App\Site\Domain\Entity'
            Project:
                type: attribute
                dir: '%kernel.project_dir%/src/Project/Domain/Entity'
                prefix: 'App\Project\Domain\Entity'
            Employee:
                type: attribute
                dir: '%kernel.project_dir%/src/Employee/Domain/Entity'
                prefix: 'App\Employee\Domain\Entity'
            Task:
                type: attribute
                dir: '%kernel.project_dir%/src/Task/Domain/Entity'
                prefix: 'App\Task\Domain\Entity'
            Finance:
                type: attribute
                dir: '%kernel.project_dir%/src/Finance/Domain/Entity'
                prefix: 'App\Finance\Domain\Entity'
            Stock:
                type: attribute
                dir: '%kernel.project_dir%/src/Stock/Domain/Entity'
                prefix: 'App\Stock\Domain\Entity'
            Document:
                type: attribute
                dir: '%kernel.project_dir%/src/Document/Domain/Entity'
                prefix: 'App\Document\Domain\Entity'
            AccessAudit:
                type: attribute
                dir: '%kernel.project_dir%/src/AccessAudit/Domain/Entity'
                prefix: 'App\AccessAudit\Domain\Entity'
            Referentiel:
                type: attribute
                dir: '%kernel.project_dir%/src/Referentiel/Domain/Entity'
                prefix: 'App\Referentiel\Domain\Entity'
            Configuration:
                type: attribute
                dir: '%kernel.project_dir%/src/Configuration/Domain/Entity'
                prefix: 'App\Configuration\Domain\Entity'

when@test:
    doctrine:
        dbal:
            # Fichier dédié pour les tests (évite le dbname_suffix MySQL-style sur SQLite)
            url: 'sqlite:///%kernel.project_dir%/var/data_test.db'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
