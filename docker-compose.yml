name: ent-soft

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-${APP_SECRET}}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////var/www/html/var/database/data.db}
      SQLITE_DATABASE_PATH: ${SQLITE_DATABASE_PATH:-/var/www/html/var/database/data.db}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-'^https?://(.*)$'}
      FRANKFURTER_API_URL: ${FRANKFURTER_API_URL:-https://api.frankfurter.dev}
      FRANKFURTER_CACHE_TTL: ${FRANKFURTER_CACHE_TTL:-3600}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_LOAD_FIXTURES: ${RUN_LOAD_FIXTURES:-false}
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-REMOTE_ADDR}
      SYMFONY_TRUSTED_HEADERS: ${SYMFONY_TRUSTED_HEADERS:-x-forwarded-for,x-forwarded-host,x-forwarded-proto}
    volumes:
      - api_uploads:/var/www/html/public/uploads
      - sqlite_data:/var/www/html/var/database
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - ent_soft

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM_HOST: ${API_UPSTREAM_HOST:-api}
      API_UPSTREAM_PORT: ${API_UPSTREAM_PORT:-80}
    networks:
      - ent_soft

networks:
  ent_soft:
    driver: bridge

volumes:
  sqlite_data:
  api_uploads:
